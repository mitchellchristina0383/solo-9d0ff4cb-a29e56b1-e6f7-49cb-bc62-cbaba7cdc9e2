services:
  layer-merger:
    build: .
    image: oci-layer-merger:1.1.0
    container_name: oci-layer-merger
    ports:
      - "8000:8000"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=512m
    # Persists the simulated cgroup files and the operation journal, so a
    # container restart can resume an unfinished operation by operation id.
    volumes:
      - cpuset-state:/var/lib/cpuset-controller
    environment:
      CPSET_STATE_DIR: /var/lib/cpuset-controller
      # Set to a positive integer to interrupt the Nth cpuset write of every
      # adjustment (fault-injection demo); leave unset for normal operation.
      CPSET_FAIL_ON_WRITE: ""
    security_opt:
      - no-new-privileges:true

volumes:
  cpuset-state:
